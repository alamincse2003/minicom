<body class="font-sans" data-header="solid">

<!-- =====================================================================
     SVG ICON SPRITE
     ===================================================================== -->
<div data-include="icons"></div>

<!-- =====================================================================
     HEADER
     ===================================================================== -->
<div data-include="header"></div>

<main class="page-top">

<!-- =====================================================================
     404 (reference: template-404)
     ===================================================================== -->
<section class="page-404">
  <div class="wrap">
    <div class="p404" data-anim="fade-up">
      <img src="assets/images/misc/404.webp" alt="404" class="p404-img" width="1100" height="1100">
      <h1 class="p404-title">Page Not found</h1>
      <p class="p404-sub">We’re sorry — something has gone wrong on our end.</p>
      <div class="p404-actions">
        <a href="index.html" class="btn btn-accent">Back to Homepage</a>
        <a href="shop.html" class="btn btn-accent">Continue shopping</a>
      </div>
    </div>
  </div>
</section>

</main>

<!-- =====================================================================
     FOOTER
     ===================================================================== -->
<div data-include="footer"></div>

<!-- =====================================================================
     OVERLAYS: drawers, search, popups
     ===================================================================== -->
<div data-include="overlays"></div>

<!-- Libraries -->
<script src="https://cdn.jsdelivr.net/npm/swiper@11.1.14/swiper-bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<!-- App: include.js loads the shared partials, then these scripts in order -->
<script src="assets/js/include.js" data-scripts="assets/data/products.js assets/js/cart.js assets/js/wishlist.js assets/js/header.js assets/js/ui.js assets/js/animations.js"></script>
