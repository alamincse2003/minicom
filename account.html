<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Account – Minicom</title>
  <meta name="description" content="Log in or create your Minicom account to see your orders and saved details.">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 3 12v16a2 2 0 0 0 2 2h22a2 2 0 0 0 2-2V12Z' fill='%23fdc402'/%3E%3Cpath d='M16 9v5M10 20a6 6 0 0 1 12 0Z' stroke='%23000' stroke-width='2' fill='%23000'/%3E%3C/svg%3E">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">

  <!-- Swiper -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11.1.14/swiper-bundle.min.css">

  <!-- Tailwind CSS v4 (browser build) -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
  <style type="text/tailwindcss">
    @theme {
      --font-sans: "DM Sans", sans-serif;
      --color-accent: #fdc402;
      --color-ink: #181818;
      --color-body: #535353;
      --color-muted: #b7b7b7;
      --color-soft: #f5f5f5;
      --color-line: #eaeaea;
      --color-sale: #e85b40;
      --color-stock: #0f834d;
      --breakpoint-3xl: 1500px;
    }
  </style>

  <!-- Custom styles -->
  <link rel="stylesheet" href="assets/css/custom.css">

  <!-- Hide reveal targets before first paint (animations.js takes over) -->
  <script>
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('js-anim');
  </script>
</head>
<body class="font-sans" data-header="solid">

<!-- =====================================================================
     SVG ICON SPRITE
     ===================================================================== -->
<div data-include="icons"></div>

<!-- =====================================================================
     HEADER
     ===================================================================== -->
<div data-include="header"></div>

<main class="page-top">

<!-- =====================================================================
     1. PAGE BANNER
     ===================================================================== -->
<section class="page-banner" style="background-image:url('assets/images/banners/breadcrumb.jpg')">
  <div class="wrap">
    <h1 id="accTitle" class="page-banner-title">Account</h1>
    <ol class="page-crumbs">
      <li><a href="index.html">Home</a></li>
      <li aria-current="page">Account</li>
    </ol>
  </div>
</section>

<!-- =====================================================================
     2. LOGIN / REGISTER (theme popup design) or DASHBOARD
        Logic: assets/js/account.js (demo accounts stored in this browser)
     ===================================================================== -->
<section class="acc-page">
  <div class="wrap" id="accountApp">

    <div id="accAuth" class="acc-card" data-anim="fade-up">
      <div class="acc-switch" data-active="login" role="tablist" aria-label="Login or register">
        <span class="acc-switch-toggle" aria-hidden="true"></span>
        <button type="button" role="tab" data-show="login" aria-selected="true">Login</button>
        <button type="button" role="tab" data-show="register" aria-selected="false">Register</button>
      </div>

      <!-- Login -->
      <form id="accLogin" class="acc-form" data-panel="login" novalidate>
        <p class="acc-form-title">Insert your account information:</p>
        <label class="acc-label" for="accLoginEmail">Email address</label>
        <input id="accLoginEmail" name="email" type="email" placeholder="Enter your email" autocomplete="email" required>
        <label class="acc-label" for="accLoginPass">Password</label>
        <div class="acc-pass"><input id="accLoginPass" name="password" type="password" placeholder="Password" autocomplete="current-password" required><button type="button" class="acc-eye" data-eye aria-label="Show password"><svg><use href="#i-eye"/></svg></button></div>
        <a href="#recover" class="acc-forgot" data-show="recover"><svg><use href="#i-mail"/></svg>Forgot your <strong>Password ?</strong></a>
        <p class="acc-msg" role="alert" hidden></p>
        <button type="submit" class="btn btn-accent w-full">Login</button>
      </form>

      <!-- Recover -->
      <form id="accRecover" class="acc-form" data-panel="recover" novalidate hidden>
        <p class="acc-form-title">Reset your password</p>
        <p class="text-[13px] -mt-4 mb-5">We will send you an email to reset your password.</p>
        <input name="email" type="email" placeholder="Email" autocomplete="email" required aria-label="Email">
        <p class="acc-msg" role="alert" hidden></p>
        <div class="grid grid-cols-2 gap-2.5">
          <button type="submit" class="btn btn-accent w-full">Submit</button>
          <button type="button" class="btn btn-secondary-light w-full" data-show="login">Cancel</button>
        </div>
      </form>

      <!-- Register -->
      <form id="accRegister" class="acc-form" data-panel="register" novalidate hidden>
        <p class="acc-form-title">Create your account</p>
        <label class="acc-label" for="accRegEmail">Email address <span>*</span></label>
        <input id="accRegEmail" name="email" type="email" placeholder="Email" autocomplete="email" required>
        <label class="acc-label" for="accRegFirst">First Name <span>*</span></label>
        <input id="accRegFirst" name="first" type="text" placeholder="First Name" autocomplete="given-name" required>
        <label class="acc-label" for="accRegLast">Last Name <span>*</span></label>
        <input id="accRegLast" name="last" type="text" placeholder="Last Name" autocomplete="family-name" required>
        <label class="acc-label" for="accRegPass">Password <span>*</span></label>
        <div class="acc-pass"><input id="accRegPass" name="password" type="password" placeholder="Password" autocomplete="new-password" required><button type="button" class="acc-eye" data-eye aria-label="Show password"><svg><use href="#i-eye"/></svg></button></div>
        <label class="acc-check"><input type="checkbox" name="news" value="1"><span></span>Sign up for our newsletter</label>
        <p class="acc-msg" role="alert" hidden></p>
        <button type="submit" class="btn btn-accent w-full">Register</button>
      </form>
    </div>

    <div id="accDash" hidden></div>
  </div>
</section>

</main>

<!-- =====================================================================
     FOOTER
     ===================================================================== -->
<div data-include="footer"></div>

<!-- =====================================================================
     OVERLAYS: drawers, search, popups
     ===================================================================== -->
<div data-include="overlays"></div>

<!-- Libraries -->
<script src="https://cdn.jsdelivr.net/npm/swiper@11.1.14/swiper-bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<!-- App: include.js loads the shared partials, then these scripts in order -->
<script src="assets/js/include.js" data-scripts="assets/data/products.js assets/js/cart.js assets/js/wishlist.js assets/js/header.js assets/js/ui.js assets/js/account.js assets/js/animations.js"></script>
</body>
</html>
